# Server Configuration
server.port=8000

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/voxalearn
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Multipart / File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Security & JWT Configuration
nexora.security.jwt.secret=nexora_ai_super_secure_jwt_secret_key_2026_production_grade_token_must_be_long_enough!
nexora.security.jwt.expiration-ms=604800000

# Service-to-Service AI Microservice Integration
nexora.ai.microservice.url=http://localhost:8001
nexora.ai.microservice.internal-key=nexora-ai-internal-key-2026

# Logging
logging.level.ai.nexora=INFO
logging.level.org.springframework.security=WARN
